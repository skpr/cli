version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "07:30"
      timezone: "Australia/Sydney"
    groups:
      go-dependencies:
        patterns:
          - "*"
      gomod-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
    ignore:
      - dependency-name: "github.com/skpr/api"
      - dependency-name: "github.com/skpr/compass"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "07:30"
      timezone: "Australia/Sydney"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 2
    groups:
      github-actions-deps:
        patterns: [ "*" ]
      github-actions-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
