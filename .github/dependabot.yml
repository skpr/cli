version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "github.com/skpr/api"
      - dependency-name: "github.com/skpr/compass"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 1
